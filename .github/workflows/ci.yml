name: XAPP Expo Validation
on:
  push:
    branches: [main, "dev/**", "feature/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: xapp-expo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    name: Expo Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo dependencies
        run: npx expo install --check
      - name: Run Expo Doctor
        run: npx expo-doctor@latest
      - name: Typecheck
        run: npm run typecheck
      - name: Verify Supabase configuration
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "Missing Supabase URL GitHub Actions secret."; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY$EXPO_PUBLIC_SUPABASE_ANON_KEY" || { echo "Missing Supabase publishable/anon GitHub Actions secret."; exit 1; }
          echo "Supabase client environment is configured."

  preview:
    name: Expo Go Tunnel Preview
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validation
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install tunnel and QR helpers
        run: npm install --no-save --no-audit --no-fund @expo/ngrok qrcode-terminal
      - name: Prepare Expo client environment
        run: |
          set -euo pipefail
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "Missing Supabase URL."; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY$EXPO_PUBLIC_SUPABASE_ANON_KEY" || { echo "Missing Supabase client key."; exit 1; }
          printf '%s\\n' \
            "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" \
            "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" \
            > .env.local
          echo "Expo .env.local prepared for the tunnel bundle."

      - name: Start Expo Go tunnel preview
        env:
          CI: "false"
        run: |
          set -euo pipefail
          rm -f expo-preview.log

          npx expo start --tunnel --go > expo-preview.log 2>&1 &
          EXPO_PID=$!
          trap 'kill "$EXPO_PID" 2>/dev/null || true' EXIT

          DEEP_LINK=""
          for i in {1..150}; do
            if ! kill -0 "$EXPO_PID" 2>/dev/null; then
              cat expo-preview.log
              echo "ERROR: Expo exited before the tunnel became ready."
              exit 1
            fi

            DEEP_LINK=$(curl -fsS --max-time 5 "http://127.0.0.1:8081/_expo/open?platform=android&runtime=expo" 2>/dev/null               | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const x=JSON.parse(s);process.stdout.write(x.url||x.deepLink||"")}catch{}})' || true)

            if [[ "$DEEP_LINK" == exp://*.exp.direct* ]]; then
              break
            fi
            echo "Waiting for public Expo tunnel... attempt $i/150"
            if [[ -n "$DEEP_LINK" ]]; then
              echo "Current URL is not a tunnel URL: $DEEP_LINK"
            fi
            sleep 2
          done

          cat expo-preview.log

          if [[ "$DEEP_LINK" != exp://* ]]; then
            echo "ERROR: No public exp.direct tunnel URL became available."
            tail -n 100 expo-preview.log
            exit 1
          fi

          echo "=============================================="
          echo "XAPP EXPO GO TUNNEL READY"
          echo "Expo Go URL: $DEEP_LINK"
          echo "=============================================="
          echo "QR CODE:"
          node -e "require('qrcode-terminal').generate(process.argv[1], {small: true})" "$DEEP_LINK"
          echo "=============================================="
          echo "This QR uses the public Expo tunnel."
          echo "Keep this GitHub Actions run open while testing."
          echo "=============================================="

          sleep 600
