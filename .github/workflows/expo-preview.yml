name: XAPP Expo Preview

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/expo-preview.yml"

jobs:
  expo-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Start Expo development server
        run: |
          npx expo start --tunnel --non-interactive > expo-preview.log 2>&1 &
          echo $! > expo.pid
          for i in {1..30}; do
            sleep 2
            if grep -Eiq "exp://|https://.*(exp|expo)" expo-preview.log; then
              break
            fi
          done
          cat expo-preview.log

      - name: Keep preview alive
        run: |
          echo "Expo preview is running. Keep this workflow open while testing."
          tail -f /dev/null
